# Replace the endpoint, model, limits and profile with a verified provider contract.
# These numeric limits are synthetic examples, not a qualified provider model.
listen = "127.0.0.1:0"
local_token_env = "ARG_LOCAL_TOKEN"

[providers.chat]
base_url = "https://your-chat-provider.example/v1"
api_key_env = "ARG_CHAT_API_KEY"

[models."example/chat"]
provider = "chat"
upstream_model = "replace-with-your-verified-model"
api = "chat_completions"
auth = "bearer"
capability_profile = "chat-profile"

[capability_profiles.chat-profile]
version = "1"
provider = "chat"
upstream_model = "replace-with-your-verified-model"
api = "chat_completions"
context_window = 32768
max_output_tokens = 1024
tested_codex_version = "0.154.0-alpha.6"

[capability_profiles.chat-profile.support]
instructions = "native"
instruction_hierarchy = "native"
function_tools = "native"
custom_tools = "bridged_custom_tool_json"
custom_grammar = "bridged_codex_patch_grammar"
namespaced_tools = "bridged_tool_namespace"
tool_choice = "native"
parallel_tool_control = "native"
max_output_tokens = "native"

# Enable only when the selected provider/model supports these native controls.
