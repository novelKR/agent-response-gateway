name: Publish prerelease

on:
  workflow_run:
    workflows: ['Release candidate']
    types: [completed]
  workflow_dispatch:
    inputs:
      candidate_run_id:
        description: Successful tag candidate run to publish without rebuilding
        required: true
        type: string

permissions:
  contents: read
  actions: read

defaults:
  run:
    shell: bash

jobs:
  verify:
    if: >-
      github.repository == 'novelKR/agent-response-gateway' &&
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      tag: ${{ steps.receipt.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          skip-decompress: false
          digest-mismatch: error
          github-token: ${{ github.token }}
          run-id: ${{ github.event.workflow_run.id || inputs.candidate_run_id }}
          pattern: release-candidate-*
          path: .local/candidates
      - name: Verify all signed targets and freeze the release manifest
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_RUN: ${{ github.event.workflow_run.id || inputs.candidate_run_id }}
        run: python -B scripts/release_provenance.py prepare-publication --directory .local/candidates --run-id "$CANDIDATE_RUN" --output .local/publication
      - id: receipt
        run: |
          python -c 'import json, os; r=json.load(open(".local/publication/release-manifest.json")); open(os.environ["GITHUB_OUTPUT"], "a").write("tag="+r["tag"]+"\n")'
          cat .local/publication/release-manifest.json >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          archive: true
          name: verified-publication
          path: .local/publication/*
          if-no-files-found: error
          retention-days: 30

  publish:
    needs: verify
    concurrency:
      group: release-${{ needs.verify.outputs.tag }}
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          skip-decompress: false
          digest-mismatch: error
          name: verified-publication
          path: .local/publication
      - name: Reverify and publish every original asset as a prerelease
        run: python -B scripts/release_provenance.py publish --directory .local/publication
