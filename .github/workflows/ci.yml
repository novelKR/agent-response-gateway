name: Rust checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: Rust 1.98.0 / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4, verified 2026-09-08
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Check public source boundary
        run: python3 -B scripts/check_public_boundary.py
      - name: Test publication checks with synthetic repositories
        run: python3 -B -m unittest discover -s scripts/tests -v
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.98.0 --profile minimal --component rustfmt --component clippy
      - name: Check formatting
        run: cargo +1.98.0 fmt --check
      - name: Clippy
        run: cargo +1.98.0 clippy --all-targets --locked -- -D warnings
      - name: Test with mock upstreams
        run: cargo +1.98.0 test --locked
