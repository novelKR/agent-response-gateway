name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  # Superseded PR checks can stop; do not interrupt a main Pages deployment.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

jobs:
  targets:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.targets.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: targets
        run: echo "matrix=$(python -B scripts/release_targets.py)" >> "$GITHUB_OUTPUT"

  format:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install 1.98.0 --profile minimal --component rustfmt
      - run: cargo +1.98.0 fmt --check

  rust:
    name: rust (${{ matrix.target }})
    needs: targets
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.targets.outputs.matrix) }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    env:
      CARGO_HOME: ${{ github.workspace }}/.local/cargo-home
      CARGO_TARGET_DIR: ${{ github.workspace }}/target
    steps:
      - name: Preserve committed file bytes on Windows
        if: runner.os == 'Windows'
        run: git config --global core.autocrlf false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'
      - run: rustup toolchain install 1.98.0 --profile minimal --component clippy
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .local/cargo-home/registry
            target
          key: rust-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}
      - run: cargo +1.98.0 clippy --all-targets --locked -- -D warnings
      - run: cargo +1.98.0 test --locked
      - run: cargo +1.98.0 build --locked
      - name: Build the optional native observer example
        run: cargo +1.98.0 build --locked --example metadata_observer
      - name: Exercise extension installation, supervision and isolation
        if: runner.os != 'Windows'
        run: python -B scripts/extension_smoke.py --binary target/debug/agent-response-gateway --observer target/debug/examples/metadata_observer
      - name: Exercise native CLI, four protocols, durable restart and graceful shutdown
        env:
          GATEWAY_EXECUTABLE: ${{ matrix.executable }}
        run: python -B scripts/package_smoke.py --binary "target/debug/$GATEWAY_EXECUTABLE" --state-dir .local/native-cli-smoke

  publication:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'
      - run: python3 -B -m unittest discover -s scripts/tests -p 'test_public_boundary.py' -v
      - run: python3 -B -m unittest discover -s scripts/tests -p 'test_ci_results.py' -v
      - run: python3 -B scripts/check_public_boundary.py
      - name: Inspect committed source archive
        run: |
          mkdir -p .local/release
          git archive --format=tar.gz --prefix=agent-response-gateway/ --output=.local/release/source.tar.gz HEAD
          python3 -B scripts/check_public_boundary.py --archive .local/release/source.tar.gz

  licenses:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      CARGO_HOME: ${{ github.workspace }}/.local/cargo-home
      CARGO_TARGET_DIR: ${{ github.workspace }}/target
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'
      - run: rustup toolchain install 1.98.0 --profile minimal
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .local/cargo-home/registry
            .local/tools
            target/license-tools
          key: licenses-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock', 'licensing/policy.json') }}
      - name: Prepare pinned license tool and locked sources
        run: |
          cargo +1.98.0 install cargo-deny --version "$(python3 -c 'import json; print(json.load(open("licensing/policy.json"))["cargo_deny_version"])')" --locked --root .local/tools --target-dir target/license-tools
          cargo +1.98.0 fetch --locked
      - run: python3 -B -m unittest discover -s scripts/tests -v
      - run: python3 -B scripts/license_audit.py check
      - name: Reproduce and inspect notice bundles
        run: |
          python3 -B scripts/license_audit.py bundle --output .local/release/licenses-a
          python3 -B scripts/license_audit.py bundle --output .local/release/licenses-b
          diff -r .local/release/licenses-a .local/release/licenses-b
          python3 -B scripts/archive_notices.py .local/release/licenses-a .local/release/license-notices.tar
          python3 -B scripts/check_public_boundary.py --archive .local/release/license-notices.tar

  codex-conformance:
    runs-on: macos-15
    timeout-minutes: 25
    env:
      CARGO_HOME: ${{ github.workspace }}/.local/cargo-home
      CARGO_TARGET_DIR: ${{ github.workspace }}/target
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'
      - run: rustup toolchain install 1.98.0 --profile minimal
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .local/cargo-home/registry
            .local/codex-runtime
            target
          key: conformance-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock', 'tests/codex/runtime-lock.json') }}
      - run: python3 -B scripts/codex_runtime.py prepare
      - run: python3 -B scripts/codex_runtime.py verify
      - run: python3 -B scripts/codex_runtime.py schema --profile experimental
      - run: cargo +1.98.0 build --locked
      - name: Run every synthetic Codex scenario
        shell: bash
        run: python3 -B tests/codex/conformance.py | tee .local/conformance-results.jsonl
      - name: Verify checked Responses tool compatibility
        run: |
          python3 -B tests/codex/conformance.py --api responses_checked
          python3 -B tests/codex/conformance.py --api responses_checked --responses-native-custom
      - name: Verify host-owned continuity with the pinned Codex
        shell: bash
        run: python3 -B tests/codex/continuity.py | tee .local/continuity-results.jsonl
      - name: Verify opaque replay prerequisite
        run: python3 -B tests/codex/opaque_continuation.py
      - name: Verify Interactions protocol and durable HTTP failures
        run: |
          python3 -B tests/codex/conformance.py --api gemini_interactions
          python3 -B tests/codex/interactions_http.py
          python3 -B tests/codex/interactions_continuity.py --resume-only
      - name: Require Interactions compaction and recovery acceptance
        run: python3 -B tests/codex/interactions_continuity.py
      - name: Require managed Claude reasoning display and recovery
        run: |
          python3 -B tests/codex/reasoning_continuity.py
          python3 -B tests/codex/reasoning_continuity.py --manual
          python3 -B tests/codex/reasoning_continuity.py --opaque-only
          python3 -B tests/codex/reasoning_continuity.py --manual --opaque-only
          python3 -B tests/codex/reasoning_continuity.py --http-only
          python3 -B tests/codex/reasoning_continuity.py --manual --http-only
      - name: Require managed Chat reasoning display and recovery
        run: |
          python3 -B tests/codex/reasoning_chat_continuity.py
          python3 -B tests/codex/reasoning_chat_continuity.py --router
          python3 -B tests/codex/reasoning_chat_continuity.py --opaque-only
          python3 -B tests/codex/reasoning_chat_continuity.py --router --opaque-only
          python3 -B tests/codex/reasoning_chat_continuity.py --http-only
          python3 -B tests/codex/reasoning_chat_continuity.py --router --http-only
      - name: Require all managed reasoning tool and cancellation scenarios
        run: python3 -B tests/codex/reasoning_conformance.py
      - name: Build the immutable Gemini v1 writer
        run: |
          git fetch --no-tags origin 7bb42c064a4e0aa26a17c821f8fe1c2e35d4175e
          mkdir -p .local/legacy-source
          git archive 7bb42c064a4e0aa26a17c821f8fe1c2e35d4175e | tar -x -C .local/legacy-source
          cargo build --locked --manifest-path .local/legacy-source/Cargo.toml --target-dir target/legacy
      - name: Resume and repair mixed legacy and current replay with Codex
        run: python3 -B tests/codex/interactions_continuity.py --legacy-gateway-bin target/legacy/debug/agent-response-gateway
      - name: Report payload-free outcomes
        if: ${{ always() }}
        run: |
          if test -f .local/conformance-results.jsonl; then
            cat .local/conformance-results.jsonl >> "$GITHUB_STEP_SUMMARY"
          fi
          if test -f .local/continuity-results.jsonl; then
            cat .local/continuity-results.jsonl >> "$GITHUB_STEP_SUMMARY"
          fi

  package-smoke:
    name: package-smoke (${{ matrix.target }})
    needs: targets
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.targets.outputs.matrix) }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    env:
      CARGO_HOME: ${{ github.workspace }}/.local/cargo-home
      CARGO_TARGET_DIR: ${{ github.workspace }}/target
    steps:
      - name: Preserve committed file bytes on Windows
        if: runner.os == 'Windows'
        run: git config --global core.autocrlf false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'
      - run: rustup toolchain install 1.98.0 --profile minimal
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .local/cargo-home/registry
            .local/tools
            target/license-tools
            target/release-candidate
          key: package-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock', 'licensing/policy.json', 'scripts/release_package.py') }}
      - name: Prepare locked build sources and pinned notice tool
        shell: bash
        run: |
          cargo +1.98.0 install cargo-deny --version "$(python -c 'import json; print(json.load(open("licensing/policy.json"))["cargo_deny_version"])')" --locked --root .local/tools --target-dir target/license-tools
          cargo +1.98.0 fetch --locked
      - run: python -B -m unittest discover -s scripts/tests -p 'test_release_package.py' -v
      - name: Build committed source and verify candidate
        env:
          PACKAGE_TARGET: ${{ matrix.target }}
        run: |
          python -B scripts/release_package.py build --target "$PACKAGE_TARGET" --output .local/package-candidate
          python -B scripts/release_package.py verify .local/package-candidate --commit "$GITHUB_SHA" --target "$PACKAGE_TARGET"
      - name: Retain only verified public candidate files
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          archive: true
          name: package-${{ matrix.target }}
          path: .local/package-candidate/*
          if-no-files-found: error
          retention-days: 14

  docs:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.21.0'
          cache: npm
          cache-dependency-path: docs-site/package-lock.json
      - run: python3 -B -m unittest discover -s scripts/tests -p 'test_docs_publication.py' -v
      - run: python3 -B scripts/check_docs.py
      - run: npm ci --prefix docs-site --ignore-scripts
      - run: npm test --prefix docs-site
      - run: npm run build --prefix docs-site
      - run: python3 -B docs-site/scripts/check-output.py
      - name: Require clean provenance for the publication candidate
        if: >-
          (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
          github.ref == 'refs/heads/main'
        run: python3 -B scripts/check_docs_publication.py --commit "$GITHUB_SHA"
      - name: Retain the verified static site for review
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          archive: true
          name: docs-site
          path: .local/docs-site/dist/
          if-no-files-found: error
          retention-days: 14
      - name: Package the same verified site for Pages
        if: >-
          (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
          github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          name: github-pages
          path: .local/docs-site/dist/
          retention-days: 14

  usage-recorder:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'
      - run: rustup toolchain install 1.98.0 --profile minimal --component clippy
      - run: cargo +1.98.0 clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo +1.98.0 test --workspace --locked
      - run: cargo +1.98.0 build --workspace --locked
      - run: python -B scripts/usage_smoke.py --binary target/debug/agent-response-gateway --recorder target/debug/gateway-usage-recorder
      - run: python -B scripts/managed_usage_smoke.py --gateway-bin target/debug/agent-response-gateway --recorder-bin target/debug/gateway-usage-recorder
      - name: Verify managed policy and recorder compatibility
        run: python -B scripts/managed_usage_smoke.py --gateway-bin target/debug/agent-response-gateway --recorder-bin target/debug/gateway-usage-recorder --compatibility-policy
      - name: Build the pre-alignment usage recorder
        run: |
          git fetch --no-tags origin bbc5d2c3e48018d94f5cc3c796b149832478de78
          mkdir -p .local/usage-legacy-source
          git archive bbc5d2c3e48018d94f5cc3c796b149832478de78 | tar -x -C .local/usage-legacy-source
          cargo build --locked --manifest-path .local/usage-legacy-source/Cargo.toml -p gateway-usage-recorder --target-dir target/legacy-usage
      - name: Upgrade the real legacy ledger and outbox
        run: python -B scripts/usage_smoke.py --binary target/debug/agent-response-gateway --recorder target/debug/gateway-usage-recorder --legacy-recorder target/legacy-usage/debug/gateway-usage-recorder
      - name: Prepare disposable PostgreSQL tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes postgresql-16
          echo "/usr/lib/postgresql/16/bin" >> "$GITHUB_PATH"
      - run: python -B scripts/usage_postgres_test.py

  ci-required:
    if: ${{ always() }}
    needs: [targets, format, rust, publication, licenses, codex-conformance, package-smoke, docs, usage-recorder]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Require every prerequisite to succeed
        env:
          CI_RESULTS: ${{ toJSON(needs) }}
        run: python3 -B scripts/check_ci_results.py

  docs-pages:
    # The merge gate includes docs, publication, licensing and every existing
    # gateway check. PRs never call this privileged deployment workflow.
    needs: ci-required
    if: >-
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      github.ref == 'refs/heads/main'
    permissions:
      pages: write
      id-token: write
    uses: novelKR/docs-actions/.github/workflows/reusable-pages-deploy.yml@6dfabdb29486dc7e4de737ab7f08d5832fd98821
    with:
      artifact-name: github-pages
      publication-branch: main
