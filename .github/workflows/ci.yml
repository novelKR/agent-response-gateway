name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  format:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - run: rustup toolchain install 1.98.0 --profile minimal --component rustfmt
      - run: cargo +1.98.0 fmt --check

  rust-linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      CARGO_HOME: ${{ github.workspace }}/.local/cargo-home
      CARGO_TARGET_DIR: ${{ github.workspace }}/target
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - run: rustup toolchain install 1.98.0 --profile minimal --component clippy
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            .local/cargo-home/registry
            target
          key: rust-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}
      - run: cargo +1.98.0 clippy --all-targets --locked -- -D warnings
      - run: cargo +1.98.0 test --locked

  rust-macos:
    runs-on: macos-15
    timeout-minutes: 25
    env:
      CARGO_HOME: ${{ github.workspace }}/.local/cargo-home
      CARGO_TARGET_DIR: ${{ github.workspace }}/target
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - run: rustup toolchain install 1.98.0 --profile minimal --component clippy
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            .local/cargo-home/registry
            target
          key: rust-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}
      - run: cargo +1.98.0 clippy --all-targets --locked -- -D warnings
      - run: cargo +1.98.0 test --locked

  publication:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.14'
      - run: python3 -B -m unittest discover -s scripts/tests -p 'test_public_boundary.py' -v
      - run: python3 -B -m unittest discover -s scripts/tests -p 'test_ci_results.py' -v
      - run: python3 -B scripts/check_public_boundary.py
      - name: Inspect committed source archive
        run: |
          mkdir -p .local/release
          git archive --format=tar.gz --prefix=agent-response-gateway/ --output=.local/release/source.tar.gz HEAD
          python3 -B scripts/check_public_boundary.py --archive .local/release/source.tar.gz

  licenses:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      CARGO_HOME: ${{ github.workspace }}/.local/cargo-home
      CARGO_TARGET_DIR: ${{ github.workspace }}/target
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.14'
      - run: rustup toolchain install 1.98.0 --profile minimal
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            .local/cargo-home/registry
            .local/tools
            target/license-tools
          key: licenses-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock', 'licensing/policy.json') }}
      - name: Prepare pinned license tool and locked sources
        run: |
          cargo +1.98.0 install cargo-deny --version "$(python3 -c 'import json; print(json.load(open("licensing/policy.json"))["cargo_deny_version"])')" --locked --root .local/tools --target-dir target/license-tools
          cargo +1.98.0 fetch --locked
      - run: python3 -B -m unittest discover -s scripts/tests -v
      - run: python3 -B scripts/license_audit.py check
      - name: Reproduce and inspect notice bundles
        run: |
          python3 -B scripts/license_audit.py bundle --output .local/release/licenses-a
          python3 -B scripts/license_audit.py bundle --output .local/release/licenses-b
          diff -r .local/release/licenses-a .local/release/licenses-b
          python3 -B scripts/archive_notices.py .local/release/licenses-a .local/release/license-notices.tar
          python3 -B scripts/check_public_boundary.py --archive .local/release/license-notices.tar

  codex-conformance:
    runs-on: macos-15
    timeout-minutes: 25
    env:
      CARGO_HOME: ${{ github.workspace }}/.local/cargo-home
      CARGO_TARGET_DIR: ${{ github.workspace }}/target
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.14'
      - run: rustup toolchain install 1.98.0 --profile minimal
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            .local/cargo-home/registry
            .local/codex-runtime
            target
          key: conformance-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock', 'tests/codex/runtime-lock.json') }}
      - run: python3 -B scripts/codex_runtime.py prepare
      - run: python3 -B scripts/codex_runtime.py verify
      - run: python3 -B scripts/codex_runtime.py schema --profile experimental
      - run: cargo +1.98.0 build --locked
      - name: Run every synthetic Codex scenario
        shell: bash
        run: python3 -B tests/codex/conformance.py | tee .local/conformance-results.jsonl
      - name: Report payload-free outcomes
        if: ${{ always() }}
        run: |
          if test -f .local/conformance-results.jsonl; then
            cat .local/conformance-results.jsonl >> "$GITHUB_STEP_SUMMARY"
          fi

  ci-required:
    if: ${{ always() }}
    needs: [format, rust-linux, rust-macos, publication, licenses, codex-conformance]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Require every prerequisite to succeed
        env:
          CI_RESULTS: ${{ toJSON(needs) }}
        run: python3 -B scripts/check_ci_results.py
