name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '17 18 * * *'
  workflow_dispatch:
  workflow_call:
    inputs:
      release_profile:
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ inputs.release_profile && 'qualification' || github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ !inputs.release_profile && (github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/main')) }}

defaults:
  run:
    shell: bash

jobs:
  validation-plan:
    outputs:
      plan: ${{ steps.plan.outputs.plan }}
      web-fixture: ${{ steps.plan.outputs.web-fixture }}
      conformance-prepare: ${{ steps.plan.outputs.conformance-prepare }}
      web-windows: ${{ steps.plan.outputs.web-windows }}
      targets: ${{ steps.plan.outputs.targets }}
      format: ${{ steps.plan.outputs.format }}
      rust: ${{ steps.plan.outputs.rust }}
      publication: ${{ steps.plan.outputs.publication }}
      licenses: ${{ steps.plan.outputs.licenses }}
      codex-conformance: ${{ steps.plan.outputs.codex-conformance }}
      package-smoke: ${{ steps.plan.outputs.package-smoke }}
      docs: ${{ steps.plan.outputs.docs }}
      usage-recorder: ${{ steps.plan.outputs.usage-recorder }}
      api-codecs: ${{ steps.plan.outputs.api-codecs }}
      management-web: ${{ steps.plan.outputs.management-web }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'
      - name: Verify impact policy
        run: python3 -B -m unittest discover -s scripts/tests -p 'test_*validation*.py' -v
      - id: plan
        name: Record source-bound execution plan
        env:
          VALIDATION_RELEASE: ${{ inputs.release_profile }}
        run: python3 -B scripts/ci_plan.py
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          archive: true
          name: validation-plan
          path: .local/validation/plan.json
          if-no-files-found: error
          retention-days: 14

  targets:
    needs: validation-plan
    if: ${{ needs.validation-plan.outputs.targets == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.targets.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: targets
        run: echo "matrix=$(python -B scripts/release_targets.py)" >> "$GITHUB_OUTPUT"

  format:
    needs: validation-plan
    if: ${{ needs.validation-plan.outputs.format == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install 1.98.0 --profile minimal --component rustfmt
      - run: cargo +1.98.0 fmt --check

  rust:
    needs: [validation-plan, targets]
    if: ${{ needs.validation-plan.outputs.rust == 'true' }}
    name: rust (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.targets.outputs.matrix) }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    env:
      CARGO_HOME: ${{ github.workspace }}/.local/cargo-home
      CARGO_TARGET_DIR: ${{ github.workspace }}/target
      MANAGEMENT_TEST_PYTHON: python
    steps:
      - name: Preserve committed file bytes on Windows
        if: runner.os == 'Windows'
        run: git config --global core.autocrlf false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'
      - run: rustup toolchain install 1.98.0 --profile minimal --component clippy
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .local/cargo-home/registry
            target
          key: rust-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}
      - name: Check selected native packages and consumers
        env:
          VALIDATION_PLAN: ${{ needs.validation-plan.outputs.plan }}
        run: python -B scripts/ci_rust.py
      - run: cargo +1.98.0 build -p agent-response-gateway --locked
      - name: Verify explicit host authentication and bounded host shutdown
        run: |
          cargo +1.98.0 build -p gateway-management-embedded --example synthetic_host --locked
          python -B scripts/embedded_host_smoke.py --binary target/debug/examples/synthetic_host
      - name: Build the optional native observer example
        run: cargo +1.98.0 build --locked --example metadata_observer
      - name: Exercise extension installation, supervision and isolation
        if: runner.os != 'Windows'
        run: python -B scripts/extension_smoke.py --binary target/debug/agent-response-gateway --observer target/debug/examples/metadata_observer
      - name: Verify profile packs alongside native observers
        if: runner.os != 'Windows'
        run: python -B scripts/extension_smoke.py --binary target/debug/agent-response-gateway --observer target/debug/examples/metadata_observer --profile-packs
      - name: Exercise native CLI, four protocols, durable restart and graceful shutdown
        env:
          GATEWAY_EXECUTABLE: ${{ matrix.executable }}
        run: python -B scripts/package_smoke.py --binary "target/debug/$GATEWAY_EXECUTABLE" --state-dir .local/native-cli-smoke

  publication:
    needs: validation-plan
    if: ${{ needs.validation-plan.outputs.publication == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'
      - run: python3 -B -m unittest discover -s scripts/tests -p 'test_public_boundary.py' -v
      - run: python3 -B -m unittest discover -s scripts/tests -p 'test_ci_results.py' -v
      - run: python3 -B scripts/check_public_boundary.py
      - name: Inspect committed source archive
        run: |
          mkdir -p .local/release
          git archive --format=tar.gz --prefix=agent-response-gateway/ --output=.local/release/source.tar.gz HEAD
          python3 -B scripts/check_public_boundary.py --archive .local/release/source.tar.gz

  licenses:
    needs: validation-plan
    if: ${{ needs.validation-plan.outputs.licenses == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      CARGO_HOME: ${{ github.workspace }}/.local/cargo-home
      CARGO_TARGET_DIR: ${{ github.workspace }}/target
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'
      - run: rustup toolchain install 1.98.0 --profile minimal
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .local/cargo-home/registry
            target/license-tools
          key: licenses-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock', 'licensing/policy.json') }}
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .local/tools
          key: license-tool-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock', 'licensing/policy.json') }}
      - name: Prepare pinned license tool and locked sources
        run: |
          python -B scripts/prepare_tools.py
      - run: python3 -B -m unittest discover -s scripts/tests -v
      - run: python3 -B scripts/license_audit.py check
      - name: Reproduce and inspect notice bundles
        run: |
          python3 -B scripts/license_audit.py bundle --output .local/release/licenses-a
          python3 -B scripts/license_audit.py bundle --output .local/release/licenses-b
          diff -r .local/release/licenses-a .local/release/licenses-b
          python3 -B scripts/archive_notices.py .local/release/licenses-a .local/release/license-notices.tar
          python3 -B scripts/check_public_boundary.py --archive .local/release/license-notices.tar

  conformance-prepare:
    needs: validation-plan
    if: ${{ needs.validation-plan.outputs.conformance-prepare == 'true' }}
    runs-on: macos-15
    timeout-minutes: 25
    outputs:
      native-sha256: ${{ steps.seal-native.outputs.sha256 }}
      codec-sha256: ${{ steps.seal-codec.outputs.sha256 }}
    env:
      CARGO_HOME: ${{ github.workspace }}/.local/cargo-home
      CARGO_TARGET_DIR: ${{ github.workspace }}/target
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'
      - run: rustup toolchain install 1.98.0 --profile minimal
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .local/cargo-home/registry
            target
          key: conformance-build-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .local/codex-runtime
          key: codex-runtime-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml', 'tests/codex/runtime-lock.json') }}
      - run: python3 -B scripts/codex_runtime.py prepare
      - run: python3 -B scripts/codex_runtime.py verify
      - run: python3 -B scripts/codex_runtime.py schema --profile experimental
      - name: Prepare the existing native and codec feature combination
        run: |
          cargo +1.98.0 build --locked --target-dir target/conformance-native
          cargo +1.98.0 build --locked --target-dir target/conformance-native --example embedded_editing
          cargo +1.98.0 build --workspace --locked
          cargo +1.98.0 build --locked --example api_codec --example api_codec_editing
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .local/tools
          key: license-tool-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock', 'licensing/policy.json') }}
      - run: python3 -B scripts/prepare_tools.py
      - run: python3 -B scripts/prepared_evidence.py .local/prepared/evidence.tar.gz
      - id: seal-native
        run: python3 -B scripts/prepared_inputs.py pack .local/prepared/native.tar.gz --variant native
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          archive: true
          name: conformance-prepared-native
          path: .local/prepared/native.tar.gz
          if-no-files-found: error
          retention-days: 3
      - id: seal-codec
        run: python3 -B scripts/prepared_inputs.py pack .local/prepared/codec.tar.gz --variant codec
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          archive: true
          name: conformance-prepared-codec
          path: .local/prepared/codec.tar.gz
          if-no-files-found: error
          retention-days: 3

  api-codecs:
    needs: [validation-plan, conformance-prepare]
    if: ${{ needs.validation-plan.outputs.api-codecs == 'true' }}
    name: api-codecs (${{ matrix.group }})
    strategy:
      fail-fast: false
      matrix:
        group: ["codec-protocol", "codec-editing-accounting"]
    runs-on: macos-15
    timeout-minutes: 25
    env:
      CARGO_HOME: ${{ github.workspace }}/.local/cargo-home
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'
      - run: rustup toolchain install 1.98.0 --profile minimal
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          skip-decompress: false
          digest-mismatch: error
          name: conformance-prepared-codec
          path: .local/prepared
      - name: Verify the exact same-run prepared inputs
        env:
          PREPARED_SHA: ${{ needs.conformance-prepare.outputs.codec-sha256 }}
        run: python3 -B scripts/prepared_inputs.py unpack .local/prepared/codec.tar.gz --variant codec --sha256 "$PREPARED_SHA"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .local/codex-runtime
          key: codex-runtime-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml', 'tests/codex/runtime-lock.json') }}
      - run: python3 -B scripts/codex_runtime.py prepare
      - run: python3 -B scripts/codex_runtime.py verify
      - name: Run the complete selected scenario group
        env:
          SUITE: ${{ matrix.group }}
        run: python3 -B scripts/conformance_suite.py "$SUITE"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ always() }}
        with:
          archive: true
          name: conformance-results-${{ matrix.group }}
          path: .local/conformance-groups/${{ matrix.group }}/results.json
          if-no-files-found: error
          retention-days: 14

  codex-conformance:
    needs: [validation-plan, conformance-prepare]
    if: ${{ needs.validation-plan.outputs.codex-conformance == 'true' }}
    name: codex-conformance (${{ matrix.group }})
    strategy:
      fail-fast: false
      matrix:
        group: ["editing", "protocol-continuity", "managed-reasoning", "legacy-migration"]
    runs-on: macos-15
    timeout-minutes: 25
    env:
      CARGO_HOME: ${{ github.workspace }}/.local/cargo-home
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'
      - run: rustup toolchain install 1.98.0 --profile minimal
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          skip-decompress: false
          digest-mismatch: error
          name: conformance-prepared-native
          path: .local/prepared
      - name: Verify the exact same-run prepared inputs
        env:
          PREPARED_SHA: ${{ needs.conformance-prepare.outputs.native-sha256 }}
        run: python3 -B scripts/prepared_inputs.py unpack .local/prepared/native.tar.gz --variant native --sha256 "$PREPARED_SHA"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .local/codex-runtime
          key: codex-runtime-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml', 'tests/codex/runtime-lock.json') }}
      - run: python3 -B scripts/codex_runtime.py prepare
      - run: python3 -B scripts/codex_runtime.py verify
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: ${{ matrix.group == 'legacy-migration' }}
        with:
          path: |
            .local/cargo-home/registry
            target/legacy
          key: legacy-writer-${{ runner.os }}-${{ runner.arch }}-7bb42c064a4e0aa26a17c821f8fe1c2e35d4175e-${{ hashFiles('rust-toolchain.toml') }}
      - name: Run the complete selected scenario group
        env:
          SUITE: ${{ matrix.group }}
        run: python3 -B scripts/conformance_suite.py "$SUITE"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ always() }}
        with:
          archive: true
          name: conformance-results-${{ matrix.group }}
          path: .local/conformance-groups/${{ matrix.group }}/results.json
          if-no-files-found: error
          retention-days: 14

  package-smoke:
    needs: [validation-plan, targets, management-web]
    if: ${{ needs.validation-plan.outputs.package-smoke == 'true' }}
    name: package-smoke (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.targets.outputs.matrix) }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    env:
      CARGO_HOME: ${{ github.workspace }}/.local/cargo-home
      CARGO_TARGET_DIR: ${{ github.workspace }}/target
    steps:
      - name: Preserve committed file bytes on Windows
        if: runner.os == 'Windows'
        run: git config --global core.autocrlf false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          skip-decompress: false
          digest-mismatch: error
          name: management-web
          path: .local/management-web/dist
      - run: rustup toolchain install 1.98.0 --profile minimal
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .local/cargo-home/registry
            target/license-tools
            target/release-candidate
          key: package-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock', 'licensing/policy.json', 'scripts/release_package.py') }}
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .local/tools
          key: license-tool-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock', 'licensing/policy.json') }}
      - name: Prepare locked build sources and pinned notice tool
        shell: bash
        run: |
          python -B scripts/prepare_tools.py
      - run: python -B -m unittest discover -s scripts/tests -p 'test_release_package.py' -v
      - name: Build committed source and verify candidate
        env:
          PACKAGE_TARGET: ${{ matrix.target }}
        run: |
          python -B scripts/release_package.py build --target "$PACKAGE_TARGET" --output .local/package-candidate
          python -B scripts/release_package.py verify .local/package-candidate --commit "$GITHUB_SHA" --target "$PACKAGE_TARGET"
      - name: Build and execute separate optional archives
        env:
          PACKAGE_TARGET: ${{ matrix.target }}
        run: |
          python -B scripts/optional_package.py build --base .local/package-candidate --output .local/optional-candidate --web-assets .local/management-web/dist
          python -B scripts/optional_package.py verify .local/optional-candidate --commit "$GITHUB_SHA" --target "$PACKAGE_TARGET"
      - name: Retain verified optional modules separately
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          archive: true
          name: optional-package-${{ matrix.target }}
          path: .local/optional-candidate/*
          if-no-files-found: error
          retention-days: 14
      - name: Retain only verified public candidate files
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          archive: true
          name: package-${{ matrix.target }}
          path: .local/package-candidate/*
          if-no-files-found: error
          retention-days: 14

  docs:
    needs: validation-plan
    if: ${{ needs.validation-plan.outputs.docs == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.21.0'
          cache: npm
          cache-dependency-path: docs-site/package-lock.json
      - run: python3 -B -m unittest discover -s scripts/tests -p 'test_docs_publication.py' -v
      - run: python3 -B scripts/check_docs.py
      - run: npm ci --prefix docs-site --ignore-scripts
      - run: npm test --prefix docs-site
      - run: npm run build --prefix docs-site
      - run: python3 -B docs-site/scripts/check-output.py
      - name: Retain the verified static site for review
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          archive: true
          name: docs-site
          path: .local/docs-site/dist/
          if-no-files-found: error
          retention-days: 14

  management-web:
    needs: validation-plan
    if: ${{ needs.validation-plan.outputs.management-web == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.21.0'
          cache: npm
          cache-dependency-path: management-web/package-lock.json
      - if: ${{ needs.validation-plan.outputs.web-fixture == 'true' }}
        run: rustup toolchain install 1.98.0 --profile minimal
      - run: npm ci --prefix management-web --ignore-scripts
      - run: python3 -B scripts/web_assets.py .local/management-web/dist
      - run: node management-web/scripts/check-output.mjs "$GITHUB_SHA"
      - if: ${{ needs.validation-plan.outputs.web-fixture == 'true' }}
        run: cargo +1.98.0 build -p gateway-management-api --example web_fixture --locked
      - name: Verify production Web and synthetic/API DevDemo modes
        env:
          REQUIRE_FIXTURE: ${{ needs.validation-plan.outputs.web-fixture }}
        run: |
          if [[ "$REQUIRE_FIXTURE" == true ]]; then
            WEB_FIXTURE_BIN="$PWD/target/debug/examples/web_fixture" npm test --prefix management-web
          else
            npm test --prefix management-web
          fi
      - name: Retain verified read-only static files
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          archive: true
          name: management-web
          path: .local/management-web/dist/
          if-no-files-found: error
          retention-days: 14

  web-windows:
    needs: validation-plan
    if: ${{ needs.validation-plan.outputs.web-windows == 'true' }}
    runs-on: windows-2025
    timeout-minutes: 15
    steps:
      - name: Preserve committed notice bytes on Windows
        run: git config --global core.autocrlf false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.21.0'
      - run: npm ci --prefix management-web --ignore-scripts
      - run: npm run build --prefix management-web
      - run: node management-web/scripts/check-output.mjs "$GITHUB_SHA"

  usage-recorder:
    needs: validation-plan
    if: ${{ needs.validation-plan.outputs.usage-recorder == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'
      - run: rustup toolchain install 1.98.0 --profile minimal --component clippy
      - run: cargo +1.98.0 clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo +1.98.0 test --workspace --locked
      - run: cargo +1.98.0 build --workspace --locked
      - run: python -B scripts/usage_smoke.py --binary target/debug/agent-response-gateway --recorder target/debug/gateway-usage-recorder
      - run: python -B scripts/managed_usage_smoke.py --gateway-bin target/debug/agent-response-gateway --recorder-bin target/debug/gateway-usage-recorder
      - name: Verify managed policy and recorder compatibility
        run: python -B scripts/managed_usage_smoke.py --gateway-bin target/debug/agent-response-gateway --recorder-bin target/debug/gateway-usage-recorder --compatibility-policy
      - name: Verify imported profiles with managed accounting
        run: python -B scripts/managed_usage_smoke.py --gateway-bin target/debug/agent-response-gateway --recorder-bin target/debug/gateway-usage-recorder --compatibility-policy --profile-packs
      - name: Build the pre-alignment usage recorder
        run: |
          git fetch --no-tags origin bbc5d2c3e48018d94f5cc3c796b149832478de78
          mkdir -p .local/usage-legacy-source
          git archive bbc5d2c3e48018d94f5cc3c796b149832478de78 | tar -x -C .local/usage-legacy-source
          cargo build --locked --manifest-path .local/usage-legacy-source/Cargo.toml -p gateway-usage-recorder --target-dir target/legacy-usage
      - name: Upgrade the real legacy ledger and outbox
        run: python -B scripts/usage_smoke.py --binary target/debug/agent-response-gateway --recorder target/debug/gateway-usage-recorder --legacy-recorder target/legacy-usage/debug/gateway-usage-recorder
      - name: Prepare disposable PostgreSQL tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes postgresql-16
          echo "/usr/lib/postgresql/16/bin" >> "$GITHUB_PATH"
      - run: python -B scripts/usage_postgres_test.py

  ci-required:
    if: ${{ always() }}
    needs: [validation-plan, conformance-prepare, web-windows, targets, format, rust, publication, licenses, codex-conformance, package-smoke, docs, usage-recorder, api-codecs, management-web]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Require every prerequisite to succeed
        env:
          CI_RESULTS: ${{ toJSON(needs) }}
          VALIDATION_PLAN: ${{ needs.validation-plan.outputs.plan }}
          VALIDATION_BASE: ${{ inputs.release_profile && github.sha || github.event.pull_request.base.sha || github.event.before || github.sha }}
          VALIDATION_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python3 -B scripts/check_ci_results.py

      - name: Record exact-source full release qualification
        if: ${{ inputs.release_profile }}
        env:
          CI_RESULTS: ${{ toJSON(needs) }}
          VALIDATION_PLAN: ${{ needs.validation-plan.outputs.plan }}
        run: python3 -B scripts/release_qualification.py
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ inputs.release_profile }}
        with:
          archive: true
          name: release-qualification
          path: .local/validation/qualification.json
          if-no-files-found: error
          retention-days: 30
