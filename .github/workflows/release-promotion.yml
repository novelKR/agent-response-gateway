name: Promote release

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing public stable-version prerelease tag (vX.Y.Z)
        required: true
        type: string

permissions:
  contents: read
  actions: read

defaults:
  run:
    shell: bash

jobs:
  verify:
    if: github.repository == 'novelKR/agent-response-gateway' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      receipt_sha: ${{ steps.receipt.outputs.sha256 }}
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ inputs.release_tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'
      - name: Verify the public release before requesting approval
        run: python -B scripts/release_provenance.py download-release --tag "$RELEASE_TAG" --output .local/release
      - id: receipt
        run: |
          python -c 'import hashlib, os; d=hashlib.sha256(open(".local/release/release-manifest.json", "rb").read()).hexdigest(); open(os.environ["GITHUB_OUTPUT"], "a").write("sha256="+d+"\n")'
          cat .local/release/release-manifest.json >> "$GITHUB_STEP_SUMMARY"

  promote:
    needs: verify
    environment: release
    concurrency:
      group: release-${{ inputs.release_tag }}
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      ARG_RELEASE_APPROVED_ENVIRONMENT: release
      RELEASE_TAG: ${{ inputs.release_tag }}
      EXPECTED_RECEIPT_SHA: ${{ needs.verify.outputs.receipt_sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'
      - name: Download and verify the same public assets again after approval
        run: |
          python -B scripts/release_provenance.py download-release --tag "$RELEASE_TAG" --output .local/release
          python -B scripts/release_provenance.py promote --directory .local/release --receipt-sha "$EXPECTED_RECEIPT_SHA"
