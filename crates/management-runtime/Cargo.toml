[package]
name = "gateway-management-runtime"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
license = "AGPL-3.0-only"
publish = false

[[bin]]
name = "gateway-managed-child"
path = "src/main.rs"

[dependencies]
agent-response-gateway = { path = "../.." }
gateway-management = { path = "../management" }
axum = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "time", "sync"] }
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tempfile = "3"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream"] }
async-stream = "0.3"
rusqlite = { version = "=0.40.2", features = ["bundled"] }
