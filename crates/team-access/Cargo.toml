[package]
name = "gateway-team-access"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
license = "AGPL-3.0-only"
description = "Opt-in named credentials and scoped management/model authority"
publish = false

[dependencies]
gateway-management = { path = "../management" }
gateway-management-api = { path = "../management-api" }
ring = "0.17"
rusqlite = { version = "=0.40.2", features = ["bundled", "backup"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zeroize = "1"

[dev-dependencies]
axum = "0.8"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
tower = { version = "0.5", features = ["util"] }
tempfile = "3"
