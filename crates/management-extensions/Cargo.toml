[package]
name = "gateway-management-extensions"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
license = "AGPL-3.0-only"
publish = false

[dependencies]
agent-response-gateway = { path = "../.." }
gateway-management = { path = "../management" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tempfile = "3"
rusqlite = { version = "=0.40.2", features = ["bundled"] }
